model:
  base_learning_rate: 1e-4
  target: pit.models.autoencoder.AutoencodingEngine
  params:
    input_key: img
    use_vf: dinov2
    use_renorm: True
    reverse_proj: True

    loss_config:
      target: pit.modules.losses.discriminator_loss.GeneralLPIPSWithDiscriminator
      params:
        perceptual_weight: 0.5
        disc_start: 20001
        disc_weight: 0.3
        learn_logvar: True
    
        regularization_weights:
          kl_loss: 0.1
        
        discriminator_config:
          target: pit.modules.lpips.model.model.NLayerDiscriminator
          params:
            input_nc: 3
            ndf: 160
            n_layers: 6
            use_actnorm: True
        
    regularizer_config:
      target: pit.quantization.gaussian.GaussianRegularizer
      params:
        sample: True
    
    encoder_config:
      target: pit.modules.unet.Encoder
      params:
        attn_type: vanilla
        double_z: true
        z_channels: 128
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: [1, 2, 4, 8, 8]
        num_res_blocks: 2
        attn_resolutions: []
        dropout: 0.
    
    decoder_config:
      target: pit.modules.unet.Decoder
      params: ${model.params.encoder_config.params}

lightning:

  modelcheckpoint:
    params:
      every_n_train_steps: 5000
      save_top_k: -1

  callbacks:
    metrics_over_trainsteps_checkpoint:
      params:
        every_n_train_steps: 10000
  
    image_logger:
      target: main.ImageLogger
      params:
        disabled: False
        enable_autocast: False
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: True
        log_first_step: True
        log_images_kwargs:
          N: 8
          n_rows: 2
  
  trainer:
    devices: 0,1,2,3,4,5,6,7
    num_nodes: 1
    precision: bf16-mixed
    benchmark: True
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    max_epochs: 40

data:
  target: pit.data.ImageDataModuleFromConfig
  params:
    num_workers: 32
    batch_size: 32

    train:
      target: pit.data.SimpleDataset
      params:
        root: /mnt/task_runtime/imagenet21k_list.txt
        image_size: 256
